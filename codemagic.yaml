workflows:
  android-release-workflow:
    name: Build Cricket Scoreboard Android APK & AAB (Release)
    max_build_duration: 35
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Universal Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
      - name: Build Android App Bundle (.aab) for Google Play
        script: |
          flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - codemaster555ali2026@gmail.com
        notify:
          success: true
          failure: true
