name: Build Cricket Scoreboard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔧 Prepare Android Platform & Wrapper
        run: |
          flutter config --no-analytics
          rm -f ./android/build.gradle.kts ./android/app/build.gradle.kts ./android/settings.gradle.kts || true
          chmod +x ./android/gradlew || true

      - name: 🧹 Flutter Clean
        run: flutter clean

      - name: 📦 Install Flutter & Dart Dependencies
        run: flutter pub get

      - name: 🩹 Patch Plugin Compatibility for Gradle 9 & AGP 9
        run: |
          for base_dir in "$HOME/.pub-cache" "/home/runner/.pub-cache" "${PUB_CACHE:-}"; do
            if [ -n "$base_dir" ] && [ -d "$base_dir" ]; then
              find "$base_dir" -type f -name "build.gradle" -exec sed -i 's/configurations\.all/configurations/g' {} + 2>/dev/null || true
            fi
          done

      - name: 🛡️ Sanitize Codebase & Fix Known Flutter Enums
        run: |
          find lib -name "*.dart" -exec sed -i 's/FontWeight\.black/FontWeight\.w900/g' {} +
          find lib -name "*.dart" -exec sed -i 's/Colors\.emeraldAccent/Colors\.tealAccent/g' {} +
          flutter analyze --no-fatal-infos || true

      - name: 🔨 Compile Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk CricketScoreboard-Universal-Release.apk

      - name: 📤 Upload Cricket Scoreboard Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketScoreboard-Release-APK
          path: CricketScoreboard-Universal-Release.apk
          if-no-files-found: error
          retention-days: 14
