plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def resolveKeystoreFile = {
    def path = System.getenv("KEYSTORE_PATH") ?: System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProperties.getProperty('storeFile')
    if (path) {
        def f = file(path)
        if (f.exists()) return f
        def fApp = file("app/${path}")
        if (fApp.exists()) return fApp
        def fRoot = rootProject.file(path)
        if (fRoot.exists()) return fRoot
        def fRootApp = rootProject.file("app/${path}")
        if (fRootApp.exists()) return fRootApp
    }
    if (file('release.keystore').exists()) return file('release.keystore')
    if (file('release.jks').exists()) return file('release.jks')
    if (rootProject.file('app/release.keystore').exists()) return rootProject.file('app/release.keystore')
    if (rootProject.file('app/release.jks').exists()) return rootProject.file('app/release.jks')
    if (file('upload-keystore.jks').exists()) return file('upload-keystore.jks')
    return null
}

def releaseKeystore = resolveKeystoreFile()
def releaseKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty('keyPassword') ?: keystoreProperties.getProperty('keystorePassword')
def releaseStorePassword = System.getenv("STORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty('storePassword') ?: keystoreProperties.getProperty('keystorePassword')
def isReleaseSigningConfigured = releaseKeystore != null && releaseKeystore.exists() && releaseKeyAlias && releaseKeyPassword && releaseStorePassword

android {
    namespace "com.cricket.scoreboard.cricket_scoreboard_15phases"
    compileSdk = 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.cricket.scoreboard.cricket_scoreboard_15phases"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (isReleaseSigningConfigured) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            if (isReleaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
