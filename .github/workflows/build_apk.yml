name: Build Cricket Scoreboard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub mobile browser or GitHub mobile app

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK (Latest Stable with Kotlin 1.9.22+)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔧 Prepare Android Platform & Wrapper
        run: |
          flutter config --no-analytics
          rm -f ./android/build.gradle.kts ./android/app/build.gradle.kts ./android/settings.gradle.kts || true
          chmod +x ./android/gradlew || true

      - name: 📦 Install Flutter & Dart Dependencies
        run: flutter pub get

      - name: 🛡️ Sanitize Codebase & Fix Known Flutter Enums
        run: |
          find lib -name "*.dart" -exec sed -i 's/FontWeight\.black/FontWeight\.w900/g' {} +
          find lib -name "*.dart" -exec sed -i 's/Colors\.emeraldAccent/Colors\.tealAccent/g' {} +

      - name: 🔨 Compile Android Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: 📤 Upload Cricket Scoreboard Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricketScoreboard-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
