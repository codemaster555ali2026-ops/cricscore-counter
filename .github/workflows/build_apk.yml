name: Build Cricket Scoreboard Android Release Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web & mobile interface

jobs:
  build-android-packages:
    name: Build Production APK & AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: ☕ Set up Java 17 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🚀 Set up Flutter SDK (Stable Channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Ensure Android SDK Platform 36 & Build-Tools Installed
        run: |
          echo "Installing Android SDK Platform 36 and Build-Tools..."
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_DIR" ] && [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: 🔧 Prepare Android Platform & Gradle Wrapper
        run: |
          flutter config --no-analytics
          rm -f ./android/build.gradle.kts ./android/app/build.gradle.kts ./android/settings.gradle.kts || true
          chmod +x ./android/gradlew || true

      - name: 🧹 Flutter Clean
        run: flutter clean

      - name: 📦 Install Flutter & Dart Dependencies
        run: flutter pub get

      - name: 🩹 Patch Plugin Compatibility for Gradle 9 & AGP 9
        run: |
          echo "Patching configurations.all for Gradle 9 compatibility across pub-cache..."
          for base_dir in "$HOME/.pub-cache" "/home/runner/.pub-cache" "${PUB_CACHE:-}"; do
            if [ -n "$base_dir" ] && [ -d "$base_dir" ]; then
              find "$base_dir" -type f -name "build.gradle" -exec sed -i 's/configurations\.all/configurations/g' {} + 2>/dev/null || true
            fi
          done
          echo "Verification: checking patched line in google_mobile_ads..."
          find "$HOME/.pub-cache" "/home/runner/.pub-cache" -path "*/google_mobile_ads*/android/build.gradle" -exec grep -n "for (def configuration" {} + 2>/dev/null || true

      - name: 🛡️ Verify Types & Analyze Codebase
        run: |
          find lib -name "*.dart" -exec sed -i 's/FontWeight\.black/FontWeight\.w900/g' {} +
          find lib -name "*.dart" -exec sed -i 's/Colors\.emeraldAccent/Colors\.tealAccent/g' {} +
          flutter analyze --no-fatal-infos || true

      - name: 🔐 Securely Restore & Verify Android Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "✅ Production signing secrets detected in GitHub Secrets."
            echo "Restoring release keystore to android/app/release.keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            chmod 600 android/app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            
            echo "🔍 Verifying APK release signing configuration..."
            if keytool -list -v -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "✅ Keystore and key alias verified successfully before building!"
            else
              echo "::warning title=Keystore Verification Warning::Keystore or alias verification check did not match. Ensure ANDROID_KEY_ALIAS and passwords match your keystore."
            fi
          else
            echo "::notice title=Release Signing Notice::Android release signing secrets are not configured in GitHub Secrets. The workflow will proceed with an unsigned release build. To generate a signed production APK, add ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD to repository secrets."
          fi

      - name: 🔨 Compile Universal Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk CricketScoreboard-Universal-Release.apk
            echo "✅ Successfully generated CricketScoreboard-Universal-Release.apk (Signed Release APK)"
            ls -lh CricketScoreboard-Universal-Release.apk
          elif [ -f "build/app/outputs/flutter-apk/app-release-unsigned.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release-unsigned.apk CricketScoreboard-Universal-Release.apk
            echo "ℹ️ Successfully generated CricketScoreboard-Universal-Release.apk (Unsigned Release APK)"
            ls -lh CricketScoreboard-Universal-Release.apk
          else
            echo "❌ ERROR: No release APK found in build/app/outputs/flutter-apk/!"
            exit 1
          fi

      - name: ⚡ Compile Split-per-ABI APKs (Targeted Architecture)
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: 📦 Compile Google Play Android App Bundle (.aab)
        run: |
          flutter build appbundle --release --no-tree-shake-icons --android-skip-build-dependency-validation || true

      - name: 📤 Upload Universal Release APK Artifact (Install on Any Android Device)
        uses: actions/upload-artifact@v5
        with:
          name: CricketScoreboard-Universal-Release-APK
          path: CricketScoreboard-Universal-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload All Built Android Packages (Split APKs & AAB)
        uses: actions/upload-artifact@v5
        with:
          name: CricketScoreboard-All-Packages
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
