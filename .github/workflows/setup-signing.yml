name: Setup Permanent Android Release Signing Key

on:
  workflow_dispatch:

jobs:
  generate-permanent-key:
    name: Generate Permanent Signing Identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v5

      - name: ☕ Set up Java 17 JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛡️ Verify No Existing Permanent Key & Passphrase Secret
        env:
          EXISTING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          EXISTING_ALIAS: ${{ secrets.KEY_ALIAS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -n "$BACKUP_PASSPHRASE" ]; then
            echo "::add-mask::$BACKUP_PASSPHRASE"
          fi

          if [ -n "$EXISTING_KEY" ] || [ -n "$EXISTING_ALIAS" ]; then
            echo "::error title=Aborting::Permanent release signing secrets already exist in this repository!"
            echo "====================================================================================="
            echo "❌ ACTION BLOCKED: A permanent signing key is already active in GitHub Secrets."
            echo "To protect existing app updates, this setup will NEVER overwrite existing keys."
            echo "====================================================================================="
            exit 1
          fi

          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error title=Missing Secret: BACKUP_PASSPHRASE::Please configure repository secret 'BACKUP_PASSPHRASE'."
            echo "====================================================================================="
            echo "❌ ACTION REQUIRED: Secure Passphrase Secret Missing"
            echo "====================================================================================="
            echo "For maximum security, backup passphrases are NOT accepted via web input fields."
            echo ""
            echo "👉 Before running this workflow:"
            echo "1. In your GitHub repository, navigate to:"
            echo "   Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "2. Set Name: BACKUP_PASSPHRASE"
            echo "3. Set Value: Your secret encryption password (minimum 8 characters)"
            echo "4. Return to the Actions tab and trigger this workflow."
            echo "====================================================================================="
            exit 1
          fi

          if [ ${#BACKUP_PASSPHRASE} -lt 8 ]; then
            echo "::error title=Weak Passphrase::The BACKUP_PASSPHRASE secret must be at least 8 characters long."
            exit 1
          fi

      - name: 🔑 Generate RSA 3072-bit JKS Keystore & Encrypt Backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.SIGNING_BACKUP_PASSPHRASE }}
        run: |
          mkdir -p .secure_signing
          cd .secure_signing

          echo "::add-mask::$BACKUP_PASSPHRASE"

          # Generate high-entropy cryptographic passwords
          STORE_PASS=$(openssl rand -base64 24 | tr -d '\n/+= ')
          KEY_PASS=$(openssl rand -base64 24 | tr -d '\n/+= ')
          ALIAS_NAME="cricket_release_key"

          # Mask all credentials from logs immediately
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$ALIAS_NAME"

          # Generate the permanent Android keystore explicitly using -storetype JKS
          keytool -genkeypair -v \
            -keystore permanent-release.jks \
            -storetype JKS \
            -alias "$ALIAS_NAME" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Cricket Scoreboard Production, OU=Mobile Engineering, O=Cricket Scoreboard, L=Global, ST=State, C=US"

          # Explicitly verify that the generated file is a valid JKS keystore
          keytool -list -v -keystore permanent-release.jks -storetype JKS -storepass "$STORE_PASS" -alias "$ALIAS_NAME" > /dev/null

          python3 -c "
with open('permanent-release.jks', 'rb') as f:
    magic = f.read(4)
    if magic != b'\xfe\xed\xfe\xed':
        raise ValueError(f'Generated keystore is not a valid JKS file. Magic header: {magic.hex()}')
print('JKS magic header verified (0xFEEDFEED).')
"

          # Extract SHA-256 public certificate fingerprint for verification
          KEY_SHA256=$(keytool -list -v -keystore permanent-release.jks -storetype JKS -storepass "$STORE_PASS" -alias "$ALIAS_NAME" | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ' :' | tr '[:upper:]' '[:lower:]')
          echo "CERT_SHA256=$KEY_SHA256" >> $GITHUB_ENV

          # Convert keystore to base64 string and mask it
          KEYSTORE_BASE64_VAL=$(base64 -w 0 permanent-release.jks)
          echo "::add-mask::$KEYSTORE_BASE64_VAL"

          # Prepare credential documentation for the user inside the encrypted container only
          cat <<EOF > signing-credentials.txt
================================================================================
CRICKET SCOREBOARD - PERMANENT ANDROID RELEASE SIGNING CREDENTIALS
================================================================================
Application ID: com.cricket.scoreboard.cricket_scoreboard_15phases
Certificate SHA-256 Fingerprint: $KEY_SHA256
Key Algorithm: RSA 3072-bit
Keystore Format: Java KeyStore (JKS)
Validity: 10,000 Days (~27 Years)
Generated On: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

INSTRUCTIONS FOR MOBILE / DESKTOP:
Copy each of the 4 values below into your GitHub repository settings:
GitHub Repository -> Settings -> Secrets and variables -> Actions -> New repository secret
--------------------------------------------------------------------------------
1. Secret Name: KEY_ALIAS
   Secret Value: $ALIAS_NAME

2. Secret Name: STORE_PASSWORD
   Secret Value: $STORE_PASS

3. Secret Name: KEY_PASSWORD
   Secret Value: $KEY_PASS

4. Secret Name: KEYSTORE_BASE64
   Secret Value:
$KEYSTORE_BASE64_VAL
================================================================================
EOF

          # Encrypt the keystore and credentials using AES-256 with the user's secret passphrase
          tar -czf - permanent-release.jks signing-credentials.txt | gpg --symmetric --cipher-algo AES256 --batch --yes --passphrase "$BACKUP_PASSPHRASE" -o permanent-signing-backup.tar.gz.gpg

          echo "✅ Securely created encrypted backup archive (AES-256)."

      - name: 🧪 Verify Encrypted Backup Decryption & Integrity
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.SIGNING_BACKUP_PASSPHRASE }}
          EXPECTED_SHA256: ${{ env.CERT_SHA256 }}
        run: |
          cd .secure_signing
          echo "Testing archive decryption and integrity verification..."

          mkdir -p .verify_backup
          gpg --decrypt --batch --yes --passphrase "$BACKUP_PASSPHRASE" permanent-signing-backup.tar.gz.gpg | tar -xz -C .verify_backup

          if [ ! -f ".verify_backup/permanent-release.jks" ] || [ ! -f ".verify_backup/signing-credentials.txt" ]; then
            echo "::error title=Backup Verification Failed::Decrypted backup archive does not contain all required files!"
            exit 1
          fi

          # Verify JKS header of decrypted keystore
          python3 -c "
with open('.verify_backup/permanent-release.jks', 'rb') as f:
    magic = f.read(4)
    if magic != b'\xfe\xed\xfe\xed':
        raise ValueError('Decrypted keystore is not a valid JKS file.')
"

          # Verify decrypted keystore SHA-256 fingerprint matches original
          DECRYPTED_SHA256=$(keytool -list -v -keystore .verify_backup/permanent-release.jks -storetype JKS -storepass:env STORE_PASS -alias cricket_release_key 2>/dev/null || true)
          # Alternatively using python to compare sha256 of the keystore binary
          ORIGINAL_HASH=$(sha256sum permanent-release.jks | awk '{print $1}')
          DECRYPTED_HASH=$(sha256sum .verify_backup/permanent-release.jks | awk '{print $1}')

          if [ "$ORIGINAL_HASH" != "$DECRYPTED_HASH" ]; then
            echo "::error title=Keystore Hash Mismatch::Decrypted keystore binary does not match the original!"
            exit 1
          fi

          rm -rf .verify_backup
          echo "✅ Encrypted backup decryption, format, and checksum verified 100% successfully."

      - name: 📤 Upload AES-256 Encrypted Backup Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Permanent-Signing-Keystore-Backup-Encrypted
          path: .secure_signing/permanent-signing-backup.tar.gz.gpg
          if-no-files-found: error
          retention-days: 7

      - name: 📋 Display Verification Fingerprint & Safe Instructions
        run: |
          echo "### 🔐 Permanent Release Signing Key Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Certificate SHA-256 Fingerprint**: \`$CERT_SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Format**: Standard Java KeyStore (JKS, RSA 3072-bit)" >> $GITHUB_STEP_SUMMARY
          echo "- **Encryption**: AES-256 (Protected by your BACKUP_PASSPHRASE secret)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📱 Mobile / Desktop Instructions to Complete One-Time Setup:" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to **Artifacts** on this workflow page and download **\`Permanent-Signing-Keystore-Backup-Encrypted\`**." >> $GITHUB_STEP_SUMMARY
          echo "2. Decrypt the file with your \`BACKUP_PASSPHRASE\`:" >> $GITHUB_STEP_SUMMARY
          echo "   - On Linux/macOS: \`gpg --decrypt permanent-signing-backup.tar.gz.gpg | tar -xz\`" >> $GITHUB_STEP_SUMMARY
          echo "   - On Android: Use Termux or OpenKeychain app to decrypt with your passphrase." >> $GITHUB_STEP_SUMMARY
          echo "3. Open \`signing-credentials.txt\` from the decrypted folder." >> $GITHUB_STEP_SUMMARY
          echo "4. In your GitHub repository, navigate to **Settings > Secrets and variables > Actions > New repository secret** and add the 4 secrets:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`KEY_ALIAS\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`STORE_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`KEY_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`KEYSTORE_BASE64\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Store \`permanent-release.jks\` securely offline or in Google Drive as your permanent signing key backup." >> $GITHUB_STEP_SUMMARY

      - name: 🧹 Secure Cleanup of Workspace
        if: always()
        run: |
          rm -rf .secure_signing
          echo "Cleaned all unencrypted files from runner disk."
